<meta charset="utf-8">
<title>KNC 영업 전광판</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    color-scheme: light;
    --page:#eef1f4; --card:#ffffff; --surface:#fbfcfd; --sunken:#f4f6f8;
    --ink:#0f1519; --secondary:#4b5560; --muted:#79868f;
    --grid:#e4e9ed; --border:rgba(15,21,25,.10); --border-strong:rgba(15,21,25,.18);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --good-ink:#0a7f0a; --bad-ink:#c0322f; --warn-ink:#a06a00;
    --track:#e6eaee;
    --shadow:0 1px 2px rgba(15,21,25,.04),0 2px 8px rgba(15,21,25,.05);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --page:#0d0f12; --card:#1c2126; --surface:#181c20; --sunken:#15191d;
      --ink:#eef2f5; --secondary:#a7b2bb; --muted:#7a878f;
      --grid:#282e34; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
      --good-ink:#22b422; --bad-ink:#e56b68; --warn-ink:#d69a12;
      --track:#262c32;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.28);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0d0f12; --card:#1c2126; --surface:#181c20; --sunken:#15191d;
    --ink:#eef2f5; --secondary:#a7b2bb; --muted:#7a878f;
    --grid:#282e34; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --good-ink:#22b422; --bad-ink:#e56b68; --warn-ink:#d69a12;
    --track:#262c32;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px 72px;}
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em;text-wrap:balance;}
  .num{font-variant-numeric:tabular-nums;}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}

  /* ── top bar + board nav ── */
  header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--page) 90%,transparent);
    backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--border);}
  .top-in{max-width:1240px;margin:0 auto;padding:12px 20px 0;}
  .top-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{width:10px;height:20px;border-radius:2px;background:linear-gradient(180deg,var(--s1),var(--s3));transform:translateY(3px);}
  .brand h1{font-size:17px;}
  .sp{flex:1;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--border);white-space:nowrap;}
  .chip.warn{color:var(--bad-ink);border-color:color-mix(in srgb,var(--critical) 45%,var(--border));background:color-mix(in srgb,var(--critical) 8%,transparent);}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .asof{font-size:12px;color:var(--muted);}
  .refresh{appearance:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--secondary);background:var(--card);
    border:1px solid var(--border);border-radius:8px;padding:5px 11px;height:29px;cursor:pointer;white-space:nowrap;}
  .refresh:hover{color:var(--ink);border-color:var(--border-strong);}
  .refresh:disabled{opacity:.6;cursor:default;}
  .refresh:focus-visible{outline:2px solid var(--s1);outline-offset:2px;}
  .mutx{color:var(--muted);font-size:11px;}
  .ttoggle{appearance:none;border:1px solid var(--border);background:var(--card);color:var(--secondary);width:32px;height:29px;border-radius:8px;cursor:pointer;display:grid;place-items:center;font-size:14px;}
  .ttoggle:hover{border-color:var(--border-strong);color:var(--ink);}
  .ttoggle:focus-visible{outline:2px solid var(--s1);outline-offset:2px;}

  nav.boards{display:flex;gap:2px;margin-top:10px;}
  nav.boards button{appearance:none;background:none;border:none;border-bottom:2px solid transparent;
    padding:9px 15px 10px;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;
    display:flex;align-items:center;gap:7px;border-radius:6px 6px 0 0;}
  nav.boards button:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 4%,transparent);}
  nav.boards button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1);}
  nav.boards button:focus-visible{outline:2px solid var(--s1);outline-offset:-2px;}
  nav.boards .bdot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55;}
  nav.boards button[aria-selected="true"] .bdot{opacity:1;}
  .bdot.live{background:var(--critical);opacity:1!important;}
  .bdot.prep{background:var(--s4);}
  .bdot.stat{background:var(--s1);}

  /* ── board intro strip ── */
  .board-intro{display:flex;gap:12px;align-items:flex-start;margin:18px 0 16px;padding:12px 15px;border-radius:11px;
    background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent,var(--s1));font-size:12.5px;color:var(--secondary);}
  .board-intro b{color:var(--ink);}
  .board-intro .axis{font-weight:650;color:var(--ink);white-space:nowrap;}

  /* ── filter row ── */
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;padding:12px 14px;
    background:var(--card);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);}
  .filters .flab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px;}
  .filters select{appearance:none;font:inherit;font-size:13px;color:var(--ink);background:var(--sunken);
    border:1px solid var(--border);border-radius:8px;padding:6px 28px 6px 10px;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 15px) 13px,calc(100% - 10px) 13px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .filters select:hover{border-color:var(--border-strong);}
  .filters select:focus-visible{outline:2px solid var(--s1);outline-offset:1px;}
  .filters .reset{appearance:none;font:inherit;font-size:12.5px;color:var(--secondary);background:none;border:1px solid var(--border);
    border-radius:8px;padding:6px 12px;cursor:pointer;}
  .filters .reset:hover{color:var(--ink);border-color:var(--border-strong);}
  .filters .hint{font-size:11.5px;color:var(--muted);margin-left:auto;}

  /* multi-select */
  .ms{position:relative;}
  .ms-btn{appearance:none;font:inherit;font-size:13px;color:var(--ink);background:var(--sunken);border:1px solid var(--border);
    border-radius:8px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;max-width:280px;}
  .ms-btn:hover{border-color:var(--border-strong);}
  .ms-btn:focus-visible{outline:2px solid var(--s1);outline-offset:1px;}
  .ms-btn .k{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
  .ms-btn .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ms-btn .cnt{font-size:11px;font-weight:700;color:#fff;background:var(--s1);border-radius:999px;padding:1px 6px;}
  .ms-btn .car{border:4px solid transparent;border-top-color:var(--muted);margin-top:3px;flex:none;}
  .ms-pop{position:absolute;z-index:40;top:calc(100% + 5px);left:0;min-width:230px;max-height:310px;overflow-y:auto;
    background:var(--card);border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.20);padding:7px;}
  .ms-pop[hidden]{display:none;}
  .ms-tools{display:flex;gap:6px;padding:3px 4px 7px;border-bottom:1px solid var(--border);margin-bottom:5px;}
  .ms-tools button{appearance:none;font:inherit;font-size:11.5px;color:var(--secondary);background:var(--sunken);
    border:1px solid var(--border);border-radius:6px;padding:3px 9px;cursor:pointer;}
  .ms-tools button:hover{color:var(--ink);}
  .ms-pop label{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;font-size:13px;cursor:pointer;}
  .ms-pop label:hover{background:color-mix(in srgb,var(--ink) 5%,transparent);}
  .ms-pop input{accent-color:var(--s1);width:14px;height:14px;flex:none;}
  .ms-pop .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ms-pop .sub{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}

  /* ── layout ── */
  section{margin-top:26px;}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:13px;}
  .sec-head h2{font-size:15px;}
  .sec-head .sub{font-size:12.5px;color:var(--muted);}
  .rule{height:1px;background:var(--border);flex:1;align-self:center;}
  .grid{display:grid;gap:15px;}
  .g4{grid-template-columns:repeat(4,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g2{grid-template-columns:1fr 1fr;}
  .g-wide{grid-template-columns:1.5fr 1fr;}
  @media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr);}.g3,.g2,.g-wide{grid-template-columns:1fr;}}
  @media(max-width:540px){.g4{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:17px;box-shadow:var(--shadow);}
  .card-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px;}
  .card h3{font-size:13.5px;color:var(--secondary);font-weight:650;}
  .card .note{font-size:11.5px;color:var(--muted);margin-top:2px;}

  /* chart/table toggle */
  .vswitch{margin-left:auto;display:flex;gap:0;border:1px solid var(--border);border-radius:7px;overflow:hidden;flex:none;}
  .vswitch button{appearance:none;background:var(--sunken);border:none;font:inherit;font-size:11px;font-weight:650;
    color:var(--muted);padding:4px 9px;cursor:pointer;}
  .vswitch button[aria-pressed="true"]{background:var(--s1);color:#fff;}
  .vswitch button:focus-visible{outline:2px solid var(--s1);outline-offset:-2px;}

  /* KPI */
  .kpi .lab{font-size:12.5px;color:var(--secondary);}
  .kpi .val{font-size:31px;font-weight:680;letter-spacing:-.02em;margin-top:7px;line-height:1;}
  .kpi .val .u{font-size:15px;font-weight:600;color:var(--secondary);margin-left:3px;}
  .kpi .sub{font-size:11.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums;}
  .kpi.accent{border-color:color-mix(in srgb,var(--s1) 40%,var(--border));}
  .meter{height:8px;border-radius:4px;background:var(--track);margin-top:11px;overflow:hidden;}
  .meter i{display:block;height:100%;border-radius:4px;background:var(--s1);}
  .delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;margin-top:8px;font-variant-numeric:tabular-nums;}
  .delta.up{color:var(--good-ink);} .delta.down{color:var(--bad-ink);} .delta.flat{color:var(--muted);}

  /* svg */
  svg.cs{display:block;width:100%;height:auto;overflow:visible;}
  .legend{display:flex;gap:15px;flex-wrap:wrap;margin:6px 0 8px;font-size:12px;color:var(--secondary);}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;transform:translateY(1px);}
  .ax{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums;}
  .glab{fill:var(--secondary);font-size:10.5px;}
  .dlab{fill:var(--ink);font-size:11px;font-weight:650;font-variant-numeric:tabular-nums;}

  /* table */
  .tbl-wrap{overflow-x:auto;margin-top:10px;}
  table.dt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  table.dt th{text-align:right;font-weight:650;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    padding:0 10px 8px 0;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);}
  table.dt th:first-child,table.dt td:first-child{text-align:left;padding-left:0;}
  table.dt td{padding:7px 10px 7px 0;border-bottom:1px solid var(--border);color:var(--secondary);}
  table.dt td:first-child{color:var(--ink);font-weight:500;}
  table.dt td:not(:first-child){text-align:right;}
  table.dt tr:last-child td{border-bottom:none;}
  table.dt tr.hot td{background:color-mix(in srgb,var(--critical) 6%,transparent);}
  .pill{display:inline-block;font-size:10.5px;font-weight:650;padding:2px 7px;border-radius:5px;}
  .pill.ok{color:var(--good-ink);background:color-mix(in srgb,var(--good) 12%,transparent);}
  .pill.warn{color:var(--warn-ink);background:color-mix(in srgb,var(--warning) 16%,transparent);}
  .pill.bad{color:var(--bad-ink);background:color-mix(in srgb,var(--critical) 11%,transparent);}
  .pill.mut{color:var(--muted);background:color-mix(in srgb,var(--muted) 12%,transparent);}

  /* alert list */
  ul.alist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:0;}
  ul.alist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  ul.alist li:last-child{border-bottom:none;}
  ul.alist .nm{color:var(--ink);font-weight:550;flex:1;}
  ul.alist .v{font-variant-numeric:tabular-nums;color:var(--secondary);font-size:12.5px;}
  .sevbar{width:3px;height:26px;border-radius:2px;flex:none;}

  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);}
  footer b{color:var(--secondary);}
  .hidden{display:none!important;}
  #tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--ink);color:var(--card);
    font-size:12px;line-height:1.45;padding:8px 10px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.28);max-width:250px;font-variant-numeric:tabular-nums;}
  #tip .tt-t{font-weight:700;margin-bottom:3px;}
  #tip .tt-r{display:flex;justify-content:space-between;gap:14px;}
  #tip .tt-r .k{opacity:.75;}
  .hoverable:hover{opacity:.84;}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
</style>

<div id="stage">
  <div class="stage-box">
    <div class="stage-mark"></div>
    <div class="stage-msg">준비 중…</div>
    <div class="stage-sub"></div>
  </div>
</div>
<style>
  #stage{position:fixed;inset:0;display:grid;place-items:center;background:var(--page);z-index:100;}
  .stage-box{text-align:center;max-width:420px;padding:0 24px;}
  .stage-mark{width:12px;height:26px;border-radius:3px;margin:0 auto 18px;
    background:linear-gradient(180deg,var(--s1),var(--s3));animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .stage-msg{font-size:15px;font-weight:650;color:var(--ink);}
  .stage-sub{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.6;}
  @media (prefers-reduced-motion:reduce){.stage-mark{animation:none}}
</style>
<script src="msal-browser.min.js"></script>
<div id="app" hidden>
<header class="top">
  <div class="top-in">
    <div class="top-row">
      <div class="brand"><span class="mark"></span><h1>KNC 영업 전광판</h1></div>
      <span class="sp"></span>
      <span class="chip warn"><span class="dot"></span>사내 한정 · 외부 공유 금지</span>
      <span class="asof num" id="asOf"></span>
      <span class="asof" id="whoami"></span>
      <button class="refresh" id="refreshBtn" title="최신 게시본을 다시 불러옵니다">↻ 새로고침</button>
      <button class="ttoggle" id="themeBtn" aria-label="테마 전환" title="라이트/다크">◐</button>
    </div>
    <nav class="boards" role="tablist" id="boardNav">
      <button role="tab" data-board="pay" aria-selected="true"><span class="bdot live"></span>입금 현황</button>
      <button role="tab" data-board="ops" aria-selected="false"><span class="bdot prep"></span>영업 현황</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <div id="boardPay" class="board"></div>
  <div id="boardOps" class="board hidden"></div>
  <footer id="foot"></footer>
</div>
</div>
<div id="tip" role="status" aria-live="polite"></div>

<script>

/* ── 라이브 데이터 (Graph API) ── */
let D = { pay: null, ops: null };

/* ============================================================
   KNC 영업 전광판 — Graph API 데이터 공급부
   뷰어 본인 계정으로 SharePoint 리스트를 직접 읽어 집계한다.
   결과는 build_*.py 가 만들던 번들과 **같은 모양**이라 화면 코드는 그대로 쓴다.
   2026-10: 앱 Shipment v1 대응 — 매출·매입·입금일·진행 판정 모두 품목(POItem) 기준,
            PO 기준은 PO 건수·상태 같은 PO별 통계만. 시험·철회 PO 제외
   ============================================================ */

const CFG = {
  tenantId: '6218e72c-b30d-40ea-9384-9468177fe407',
  clientId: '680e5d22-ac42-4869-8690-9291ab8c9fad',          // ← Entra 앱 등록 후 여기에 채운다
  siteId: 'kncmarinekr.sharepoint.com,ea02f875-c730-4ec4-a6e4-b55a13672689,716f7444-0f22-46b9-bdca-fa1f535b3e47',
  lists: {
    po:     '9c9bc26a-d398-4bfb-9f66-0e99c3ffbd3e',
    poitem: 'a475dd11-7cfa-42e1-ab70-5510e40cc01a',
    cogs:   '63e212e1-c6e8-430a-9a90-1a63fd3d999c',
    buyer:  '1fbfa37b-3c3b-4575-a44a-c7b418dfeb4a',
    seller: '62567a70-e5f2-4363-b8ff-b71eb7168f4a',
    worklog: 'b0398f59-a7d6-49b9-9855-6d7bbb4cb3c8',
  },
  scopes: ['https://graph.microsoft.com/Sites.Read.All'],
  annualTarget: 0,   // Buyer 리스트의 SalesTarget 합계로 대체됨 (아래 F.target)
};

/* SharePoint 내부 필드명 — 한글 컬럼명은 인코딩되어 있다 */
const F = {
  name: 'Korean_Name',
  deal: '_xac70__xb798__xc0c1__xd669_',          // 거래상황
  industry: 'Industry_Category',
  target: '_xc601__xc5c5__xbaa9__xd45c__x00',    // 영업목표 (SalesTarget, currency)
};

/* 품목·원가는 필요한 칸만 받는다 (전체 칸을 받으면 수 MB) */
const ITEM_FIELDS = ['PO_NoLookupId', 'Sales', 'SalesUSD', 'Currency', 'FXRate', 'PaymentDate', 'Status',
                     'OperationalState', 'DeliveryDate', 'ShipmentDate', 'SumCOGS', 'LogisticCost', 'ExtraCost'];
const COGS_FIELDS = ['POItemIDLookupId', 'Price', 'KRW_x002f_USD', 'PaymentConfirmation', 'PaymentDate', 'OperationalState'];

/* ── 인증 ── (msal-browser UMD 전역은 `msal`) */
let msalApp, account;
async function signIn() {
  if (typeof msal === 'undefined' || !msal.PublicClientApplication) {
    throw new Error('MSAL 라이브러리를 불러오지 못했습니다 (msal-browser.min.js 확인)');
  }
  msalApp = new msal.PublicClientApplication({
    auth: {
      clientId: CFG.clientId,
      authority: `https://login.microsoftonline.com/${CFG.tenantId}`,
      // 주소를 /index.html 로 정규화 — 사용자가 '…/knc-sales-board/' 로 들어와도
      // 등록된 리디렉션 URI와 일치하도록 (AADSTS50011 방지)
      redirectUri: location.origin
        + (location.pathname.endsWith('/') ? location.pathname + 'index.html' : location.pathname),
    },
    cache: { cacheLocation: 'sessionStorage' },
  });
  await msalApp.initialize();
  const r = await msalApp.handleRedirectPromise();
  if (r) account = r.account;
  if (!account) {
    const all = msalApp.getAllAccounts();
    if (all.length) account = all[0];
  }
  if (!account) {
    await msalApp.loginRedirect({ scopes: CFG.scopes });
    return null;
  }
  msalApp.setActiveAccount(account);
  return account;
}

async function token() {
  try {
    const r = await msalApp.acquireTokenSilent({ scopes: CFG.scopes, account });
    return r.accessToken;
  } catch (e) {
    await msalApp.acquireTokenRedirect({ scopes: CFG.scopes });
    throw e;
  }
}

/* ── Graph 조회 (페이징) ── select: 받을 필드 목록(없으면 전체) */
async function fetchList(listId, onProgress, select) {
  const t = await token();
  const fx = select ? `fields($select=${select.join(',')})` : 'fields';
  let url = `https://graph.microsoft.com/v1.0/sites/${CFG.siteId}/lists/${listId}/items?expand=${fx}&$top=999`;
  const out = [];
  while (url) {
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + t } });
    if (!res.ok) throw new Error(`Graph ${res.status}: ${(await res.text()).slice(0, 200)}`);
    const j = await res.json();
    // $select 로 받으면 fields 안에 id가 없다 → 리스트 항목 id를 붙여 둔다 (COGS↔품목 연결용)
    out.push(...j.value.map(v => (v.fields ? Object.assign({ id: v.id }, v.fields) : v)));
    url = j['@odata.nextLink'] || null;
    if (onProgress) onProgress(out.length);
  }
  return out;
}

/* ── 유틸 ── */
const D_ = v => { if (!v) return null; const s = String(v).slice(0, 10);
  const d = new Date(s + 'T00:00:00Z'); return isNaN(d) ? null : d; };
const N_ = v => (typeof v === 'number' ? v : parseFloat(v) || 0);
const ymd = d => d.toISOString().slice(0, 10);
const ym_ = d => d.toISOString().slice(0, 7);
const doy = d => Math.floor((d - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5);
const validD = d => (d && d.getUTCFullYear() >= 2000 ? d : null);   // 1970-01-01 같은 오류값은 날짜 없음으로
const DAY = 864e5;
/* 품목 날짜 여러 개를 한 칸에 — 가장 이른 날 + 나머지 회차 수 (예: 2026-08-22 외 1) */
function dateSpan(ds) {
  const u = [...new Set(ds.filter(Boolean).map(ymd))].sort();
  return u.length ? u[0] + (u.length > 1 ? ` 외 ${u.length - 1}` : '') : '';
}

/* PO 번호에서 제품(PP)·고객(BB) 코드 분리: 예 VH-2734-BY */
function parsePono(no) {
  const m = String(no || '').match(/^([A-Z0-9]+)-[^-]+-([A-Z0-9]+)$/i);
  return m ? { pp: m[1].toUpperCase(), bb: m[2].toUpperCase() } : { pp: null, bb: null };
}

const PRE_COST = new Set(['Pending', 'PO Confirmed', 'Ship Scheduled']);
const POST_COST = new Set(['Shipped', 'Partial Shipped', 'Delivered', 'COGS Confirmed', 'Buyer Paid']);
const ITEM_DONE = new Set(['Delivered', 'Buyer Paid']);   // 품목이 이미 고객에게 도착한 상태

/* ── 집계 제외 ──
   · 시험·재고이동 PO: 앱 v1 시험 PO(R55 시리즈), 일련번호에 test/stock — 분기 보고 config/exclude_po.json 과 같은 대상
   · DataPurpose = Test / Training
   · 철회: OperationalState = Withdrawn. 철회해도 Status는 그대로 남는다.
     WithdrawnAt은 복원(Reinstate) 뒤에도 남으므로 판정에 쓰지 않는다. */
const TEST_PONO = /^[A-Z0-9]+-(R\d+[A-Z]?|[^-]*(test|stock)[^-]*)-[A-Z0-9]+$/i;
const withdrawn = f => f.OperationalState === 'Withdrawn';
function excludeReason(f) {
  if (withdrawn(f)) return 'withdrawn';
  if (f.DataPurpose === 'Test' || f.DataPurpose === 'Training') return 'test';
  if (TEST_PONO.test((f.Title || '').trim())) return 'test';
  return null;
}

/* PO 리스트 id → 철회 안 된 품목들 */
function groupItems(items) {
  const m = new Map();
  for (const it of items || []) {
    if (withdrawn(it)) continue;
    const k = String(it.PO_NoLookupId || '');
    if (!k) continue;
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(it);
  }
  return m;
}

/* ── 품목 금액 ──
   매출 = POItem.Sales (원화). 달러 단가 품목인데 환율이 비어 있으면(FXRate ≤ 1) 달러 숫자가 그대로 들어가 있어
          집계에서 빼고 '원화 환산 누락'으로 보여준다.
   매입 = 품목 원가 + 품목 물류비(LogisticCost) + 품목 부대비(ExtraCost).
          품목 원가 = COGS 리스트 행 합 (Price[달러, 조정액 포함] × KRW_x002f_USD[원/달러]).
          COGS 행이 없거나 환율 빠진 행이 있으면 POItem.SumCOGS (분할 선적으로 생긴 품목은 COGS 행이 없다). */
const fxMissing = it => it.Currency === 'USD' && N_(it.FXRate) <= 1;
const itemSales = it => (fxMissing(it) ? 0 : N_(it.Sales));

function itemCostMap(cogsRows) {
  const m = new Map();
  for (const c of cogsRows || []) {
    if (withdrawn(c)) continue;
    const k = String(c.POItemIDLookupId || '');
    if (!k) continue;
    if (!m.has(k)) m.set(k, { krw: 0, paid: 0, norate: 0 });
    const o = m.get(k), rate = N_(c.KRW_x002f_USD);
    if (!rate) { o.norate++; continue; }
    const v = N_(c.Price) * rate;
    o.krw += v;
    if (c.PaymentConfirmation === true) o.paid += v;
  }
  return m;
}

function itemMoney(it, costMap) {
  const c = costMap.get(String(it.id));
  let cogs = 0, paid = 0;
  if (c && !c.norate) { cogs = c.krw; paid = c.paid; }
  else if (N_(it.SumCOGS) > 0) cogs = N_(it.SumCOGS);           // 지급 여부는 알 수 없음 → 미지급으로
  else if (c) { cogs = c.krw; paid = c.paid; }
  const sales = itemSales(it);
  return { sales, cogs, paid, cost: cogs + N_(it.LogisticCost) + N_(it.ExtraCost), covered: cogs > 0 };
}

/* PO 하나를 입금 단위로 — 품목마다 결제일·금액·상태
   앱 v1은 분할·부분 선적 품목마다 결제일을 따로 두고 PO 결제일엔 그중 가장 늦은 날짜만 남긴다.
   · 품목이 없음 → PO 헤더 값 하나로 (예전 방식)
   · 어느 품목에도 결제일이 없음 → 모든 품목에 PO 결제일 (옛 데이터)
   · 일부 품목만 결제일 있음 → 없는 품목은 '결제일 미정' (아직 선적 전인 잔량) */
function poUnits(f, its, costMap) {
  const pd = validD(D_(f.Payment_Date));
  if (!its.length) {
    const cogs = N_(f.COGSTotal);
    return [{ date: pd, st: f.Status || null, sales: N_(f.Sales_KRW_Total), cogs, paid: 0,
              cost: cogs + N_(f.ExtraKRWTotal) + N_(f.LogisticKRWTotal), covered: cogs > 0 }];
  }
  const anyItemDate = its.some(it => validD(D_(it.PaymentDate)));
  return its.map(it => Object.assign({
    date: anyItemDate ? validD(D_(it.PaymentDate)) : pd,
    st: it.Status || f.Status || null,
  }, itemMoney(it, costMap)));
}

/* ── 집계: 입금 현황 ── */
function buildPay(poRows, items, cogsRows, buyers, asof) {
  const CUR_Y = String(asof.getUTCFullYear());
  const cutoff = doy(asof);
  const FROM_Y = 2021;
  const itemsBy = groupItems(items);
  const costMap = itemCostMap(cogsRows);
  const cells = new Map(), sched = new Map();
  const key = (bb, ym) => bb + '|' + ym;

  const statusAgg = new Map();
  const gaps = [], anomalies = [], fxList = [];
  const excluded = { test: { po: 0, sales: 0 }, withdrawn: { po: 0, sales: 0 } };
  const pipeline = {
    collected: { po: 0, sales: 0 },
    '생산 중': { po: 0, sales: 0, cogs_po: 0 },
    '출하·납품 완료': { po: 0, sales: 0, cogs_po: 0 },
    '상태미상': { po: 0, sales: 0, cogs_po: 0 },
    no_paydate: { po: 0, sales: 0 },
  };
  // 건수는 PO 중복 없이 센다 (한 PO가 여러 회차로 나뉘어도 같은 칸에선 1건)
  const pset = {}, pcov = {};
  for (const k in pipeline) { pset[k] = new Set(); pcov[k] = new Set(); }
  const regSet = new Set(), unregSet = new Set(), paidSet = new Set();
  let regSales = 0, regCost = 0, unregSales = 0, paidKrw = 0, unpaidKrw = 0;
  let included = 0, splitPo = 0;

  for (const f of poRows) {
    const pono = (f.Title || '').trim();
    if (!pono) continue;
    const why = excludeReason(f);
    if (why) {
      const xi = itemsBy.get(String(f.id)) || [];
      excluded[why].po++;
      excluded[why].sales += xi.length ? xi.reduce((a, it) => a + itemSales(it), 0) : N_(f.Sales_KRW_Total);
      continue;
    }
    included++;
    const { bb } = parsePono(pono);
    const st = f.Status || null;
    const pod = D_(f.field_4);
    const its = itemsBy.get(String(f.id)) || [];
    const units = poUnits(f, its, costMap);
    const poSales = units.reduce((a, u) => a + u.sales, 0);

    // 점검 카드의 ETD·납품일은 해당 품목 값으로 (PO 헤더 ETD는 계획일이 갱신 안 된 채 남아 있다)
    const etdTxt = (xs = its) => dateSpan(xs.map(it => it && validD(D_(it.ShipmentDate))));
    const delTxt = (xs = its) => dateSpan(xs.map(it => it && validD(D_(it.DeliveryDate))));

    // PO별 통계 — 상태별 건수 (금액은 품목 합)
    const sk = st || '(미지정)';
    if (!statusAgg.has(sk)) statusAgg.set(sk, { status: sk, po: 0, cogs_po: 0, sales: 0, missing_sales: 0, pre_cost: PRE_COST.has(sk) });
    const sa = statusAgg.get(sk);
    sa.po++; sa.sales += poSales;
    if (units.some(u => u.covered)) sa.cogs_po++; else sa.missing_sales += poSales;

    // 원가 누락 — 이미 선적·납품된 품목인데 원가가 없음 (품목 단위로 찾아 PO별로 묶음)
    const gapUnits = its.length
      ? its.map((it, i) => [it, units[i]]).filter(([it, u]) => POST_COST.has(it.Status) && u.sales > 0 && !u.covered)
      : (POST_COST.has(st) && !units[0].covered && units[0].sales > 0 ? [[null, units[0]]] : []);
    const gapIts = gapUnits.map(([it]) => it).filter(Boolean);
    if (gapUnits.length) gaps.push({ po: pono, bb, status: st, items: gapUnits.length,
      sales: gapUnits.reduce((a, [, u]) => a + u.sales, 0),
      etd: gapIts.length ? etdTxt(gapIts) : '', delivery: gapIts.length ? delTxt(gapIts) : '' });

    // 입금일 이상값 — 품목 결제일 기준 (1970-01-01 같은 값)
    const badPay = its.map((it, i) => [it, units[i]]).filter(([it]) => it.PaymentDate && !validD(D_(it.PaymentDate)));
    if (badPay.length) anomalies.push({ po: pono, bb, status: st || '(미지정)',
      sales: badPay.reduce((a, [, u]) => a + u.sales, 0),
      value: [...new Set(badPay.map(([it]) => String(it.PaymentDate).slice(0, 10)))].join(', '),
      podate: pod ? ymd(pod) : '', etd: etdTxt(badPay.map(([it]) => it)), delivery: delTxt(badPay.map(([it]) => it)) });

    // 원화 환산 누락 — 달러 단가 품목인데 환율이 비어 있음
    const fx = its.filter(fxMissing);
    if (fx.length) fxList.push({ po: pono, bb, status: st || '(미지정)', items: fx.length,
      usd: fx.reduce((a, it) => a + (N_(it.SalesUSD) || N_(it.Sales)), 0) });

    if (new Set(units.map(u => u.date ? +u.date : 0)).size > 1) splitPo++;
    for (const u of units) {
      const s = u.sales, co = u.cost, cg = u.cogs, d = u.date, covered = u.covered;
      const counts = s !== 0;                       // 매출 0인 품목(무상 재공급 등)은 건수에 넣지 않는다

      // 셀 집계 (고객 × 입금월)
      if (d && d.getUTCFullYear() >= FROM_Y) {
        const k = key(bb || '미상', ym_(d));
        if (!cells.has(k)) cells.set(k, { bb: bb || '미상', ym: ym_(d),
          sales: 0, cost: 0, cogs: 0, csales: 0, po: 0,
          col_sales: 0, col_cost: 0, col_cogs: 0, col_csales: 0, col_po: 0,
          ytd_sales: 0, ytd_cost: 0, ytd_cogs: 0, ytd_csales: 0, ytd_po: 0,
          _po: new Set(), _col: new Set(), _ytd: new Set() });
        const c = cells.get(k);
        c.sales += s; if (counts) c._po.add(pono);
        if (covered) { c.cost += co; c.cogs += cg; c.csales += s; }
        if (d <= asof) {
          c.col_sales += s; if (counts) c._col.add(pono);
          if (covered) { c.col_cost += co; c.col_cogs += cg; c.col_csales += s; }
        } else {
          if (!sched.has(k)) sched.set(k, { bb: bb || '미상', ym: ym_(d), sales: 0, po: 0, _po: new Set() });
          const s2 = sched.get(k); s2.sales += s; if (counts) s2._po.add(pono);
        }
        if (doy(d) <= cutoff) {
          c.ytd_sales += s; if (counts) c._ytd.add(pono);
          if (covered) { c.ytd_cost += co; c.ytd_cogs += cg; c.ytd_csales += s; }
        }
      }

      // 파이프라인 (수금완료 / 미수금 진행분) — 진행 단계는 품목 상태로
      if (pod) {
        if (d && d <= asof) {
          if (String(d.getUTCFullYear()) === CUR_Y) { pipeline.collected.sales += s; if (counts) pset.collected.add(pono); }
        } else {
          const grp = PRE_COST.has(u.st) ? '생산 중' : (POST_COST.has(u.st) ? '출하·납품 완료' : '상태미상');
          if (grp !== '상태미상' || u.st) {
            pipeline[grp].sales += s;
            if (counts) { pset[grp].add(pono); if (covered) pcov[grp].add(pono); }
            if (!d) { pipeline.no_paydate.sales += s; if (counts) pset.no_paydate.add(pono); }
          }
        }
        // 매입 3단 (파이프라인 대상분) — 지급 완료는 COGS 지급확인(PaymentConfirmation) 기준
        const inPipe = (d && d <= asof)
          ? String(d.getUTCFullYear()) === CUR_Y
          : (PRE_COST.has(u.st) || POST_COST.has(u.st));
        if (inPipe) {
          if (covered) {
            regSales += s; regCost += co; paidKrw += u.paid; unpaidKrw += co - u.paid;
            regSet.add(pono); if (u.paid > 0) paidSet.add(pono);
          } else if (s !== 0) { unregSales += s; unregSet.add(pono); }
        }
      }
    }
  }

  for (const k in pipeline) {
    pipeline[k].po = pset[k].size;
    if ('cogs_po' in pipeline[k]) pipeline[k].cogs_po = pcov[k].size;
  }
  const union = (...ks) => new Set(ks.flatMap(k => [...pset[k]])).size;
  pipeline.secured_po = union('collected', '생산 중', '출하·납품 완료');   // 한 PO가 두 단계에 걸치면 1건
  pipeline.open_po = union('생산 중', '출하·납품 완료');

  const cellRows = [...cells.values()].map(c => {
    c.po = c._po.size; c.col_po = c._col.size; c.ytd_po = c._ytd.size;
    delete c._po; delete c._col; delete c._ytd; return c;
  });
  const schedRows = [...sched.values()].map(s => { s.po = s._po.size; delete s._po; return s; });
  // 지급확인 기록률 — 지급예정일이 30~210일 지난 원가 중 지급확인(PaymentConfirmation)된 비율.
  // 낮으면 지급 완료/미지급 구분을 믿기 어렵다는 경고를 띄운다 (2026-10 기준 4월 이후 기록이 끊겨 있음)
  let dueAll = 0, dueOk = 0;
  for (const c of cogsRows || []) {
    const due = validD(D_(c.PaymentDate)), rate = N_(c.KRW_x002f_USD);
    if (!due || !rate || withdrawn(c)) continue;
    const age = (asof - due) / DAY;
    if (age < 30 || age > 210) continue;
    const v = N_(c.Price) * rate;
    dueAll += v; if (c.PaymentConfirmation === true) dueOk += v;
  }
  const payRecord = costMap.size ? (dueAll ? dueOk / dueAll : 1) : 0;

  const costRate = regSales ? regCost / regSales : 0;
  const estKrw = unregSales * costRate;
  const pipeSales = regSales + unregSales;
  const totalCost = paidKrw + unpaidKrw + estKrw;

  // 고객 명단 — 목표(SalesTarget)·거래상황·산업군 모두 SharePoint Buyer 리스트에서 읽는다
  const bmap = new Map();
  for (const b of buyers) if (b.Title) bmap.set(b.Title, b);
  const seen = new Set(cellRows.map(c => c.bb));
  const customers = [...seen].map(bb => {
    const b = bmap.get(bb) || {};
    return { bb, name: b[F.name] || bb, status: b[F.deal] || null,
             industry: b[F.industry] || '미분류', target: Number(b[F.target] || 0) };
  }).sort((a, b) => b.target - a.target);
  const annualTarget = buyers.reduce((a, b) => a + Number(b[F.target] || 0), 0) || CFG.annualTarget;

  return {
    meta: {
      board: '입금 현황', axis: '입금일(품목 결제일)', as_of: ymd(asof),
      cutoff_doy: cutoff, current_year: CUR_Y, from_year: FROM_Y,
      generated: new Date().toISOString(),
      item_basis: itemsBy.size > 0,       // 품목을 못 읽으면 PO 헤더 값으로 집계된다
      cogs_basis: costMap.size > 0,       // COGS 리스트를 못 읽으면 품목 SumCOGS로, 지급 완료는 0
      split_po: splitPo,                  // 결제일이 2개 이상으로 나뉜 PO
      excluded,
      quality: {
        payment_date_invalid: anomalies.length, payment_date_missing: 0, total_po: included,
        anomalies, anomaly_count: anomalies.length,
        anomaly_sales: anomalies.reduce((a, x) => a + x.sales, 0),
        status: [...statusAgg.values()].sort((a, b) => b.po - a.po),
        normal_missing: {
          po: [...statusAgg.values()].filter(s => s.pre_cost).reduce((a, s) => a + (s.po - s.cogs_po), 0),
          sales: [...statusAgg.values()].filter(s => s.pre_cost).reduce((a, s) => a + s.missing_sales, 0),
        },
        gaps, gap_count: gaps.length, gap_sales: gaps.reduce((a, g) => a + g.sales, 0),
        fx_missing: fxList, fx_count: fxList.length,
        fx_items: fxList.reduce((a, x) => a + x.items, 0), fx_usd: fxList.reduce((a, x) => a + x.usd, 0),
      },
    },
    annual_target: annualTarget,
    pipeline,
    purchase: {
      sales: pipeSales, po: new Set([...regSet, ...unregSet]).size,   // 원가 등록·미등록 품목이 섞인 PO는 1건
      paid: { krw: paidKrw, po: paidSet.size },
      unpaid: { krw: unpaidKrw, po: regSet.size },
      unregistered: { krw: estKrw, po: unregSet.size, sales: unregSales, rate: costRate },
      total_cost: totalCost,
      profit: pipeSales - totalCost,
      margin: pipeSales ? (pipeSales - totalCost) / pipeSales : null,
      confirmed_profit: regSales - regCost,
      confirmed_margin: regSales ? (regSales - regCost) / regSales : null,
      cogs_paydate_coverage: payRecord,   // 지급 완료 = COGS 지급확인 기준. 기록률이 낮으면(또는 못 읽으면) 화면에 경고
    },
    customers,
    cells: cellRows,
    scheduled: schedRows,
  };
}

/* ── 진입점 ── */
async function loadLive(onProgress) {
  await signIn();
  if (!account) return null;
  onProgress && onProgress('PO 리스트 읽는 중…');
  const po = await fetchList(CFG.lists.po, n => onProgress && onProgress(`PO ${n}건…`));
  onProgress && onProgress('품목 읽는 중…');
  let items = [], cogs = [];
  try { items = await fetchList(CFG.lists.poitem, n => onProgress && onProgress(`품목 ${n}건…`), ITEM_FIELDS); }
  catch (e) { console.warn('POItem 조회 실패 — PO 헤더 값으로 집계합니다:', e.message); }
  onProgress && onProgress('원가 읽는 중…');
  try { cogs = await fetchList(CFG.lists.cogs, n => onProgress && onProgress(`원가 ${n}건…`), COGS_FIELDS); }
  catch (e) { console.warn('COGS 조회 실패 — 품목 SumCOGS로 집계합니다:', e.message); }
  onProgress && onProgress('고객 정보 읽는 중…');
  const buyers = await fetchList(CFG.lists.buyer);
  onProgress && onProgress('업무일지 읽는 중…');
  let worklog = [];
  try { worklog = await fetchList(CFG.lists.worklog); }
  catch (e) { console.warn('WORK LOG 조회 실패 — 면담 경과일은 비웁니다:', e.message); }
  const asof = new Date(new Date().toISOString().slice(0, 10) + 'T00:00:00Z');
  onProgress && onProgress('집계 중…');
  return { pay: buildPay(po, items, cogs, buyers, asof),
           ops: buildOps(po, items, buyers, worklog, asof),
           _who: account.username };
}

/* ── 집계: 영업 현황 ── */

/* WORK LOG 필드 (columns_map 기준) */
const WL = {
  category: 'field_3',      // 일반관리 / Trading / WorkShop / 고객동향 / 주물관리 / 신제품 / 품질 / 사무자동화
  start: 'field_6',         // StartDate
  buyer: 'BuyerLookupId',
};

/* PO 하나의 납품 진행 — 품목 단위로 판정한다
   · 품목 납품일이 지났거나 품목 상태가 Delivered/Buyer Paid → 납품 끝
   · 남은 품목의 납품예정 = 품목 납품일(선적 구성 후 생김) 중 가장 이른 날.
     선적 일정이 하나도 없으면 고객 요청납기(BuyerRequestDeliveryDate) — 앱 v1은 선적 구성(T2) 전엔 납품일을 쓰지 않는다
   · ETD = 남은 품목의 선적일(POItem.ShipmentDate, 선적 구성 후 생김). PO 헤더 ETD(field_5)는
     계획일이 갱신 안 된 채 남아 있어 쓰지 않는다. 항차 계획(PlannedETD)도 지난 계획이 남아 있어 쓰지 않는다
   · 금액 = 남은 품목의 매출 합 (POItem.Sales)
   · 품목이 없으면 PO 헤더 값으로 (예전 방식) */
function poSchedule(f, its, asof) {
  const req = validD(D_(f.BuyerRequestDeliveryDate));
  if (!its.length) {
    const dl = validD(D_(f.DeliveryDate));
    const open = !(dl && dl <= asof);
    return { open, sales: N_(f.Sales_KRW_Total), sales_open: open ? N_(f.Sales_KRW_Total) : 0, partial: false,
             next: open ? (dl ? { d: dl, src: 'ship' } : (req ? { d: req, src: 'req' } : null)) : null,
             last_del: dl && dl <= asof ? dl : null, etd: null };
  }
  let salesOpen = 0, nOpen = 0, ship = null, unscheduled = false, last = null, etd = null;
  for (const it of its) {
    const dl = validD(D_(it.DeliveryDate));
    const done = ITEM_DONE.has(it.Status) || (dl && dl <= asof);
    if (dl && dl <= asof && (!last || dl > last)) last = dl;
    if (done) continue;
    nOpen++;
    salesOpen += itemSales(it);
    if (dl) { if (!ship || dl < ship) ship = dl; } else unscheduled = true;
    const e = validD(D_(it.ShipmentDate));
    if (e && (!etd || e < etd)) etd = e;
  }
  const next = ship ? { d: ship, src: 'ship' } : (unscheduled && req ? { d: req, src: 'req' } : null);
  return { open: nOpen > 0, sales: its.reduce((a, it) => a + itemSales(it), 0),
           sales_open: salesOpen, partial: nOpen > 0 && nOpen < its.length, next, last_del: last, etd };
}

function buildOps(poRows, items, buyers, worklog, asof) {
  const bmap = new Map();
  for (const b of buyers) if (b.Title) bmap.set(b.Title, b);
  const byId = new Map();                       // Buyer 리스트 id → BB 코드
  for (const b of buyers) if (b.id) byId.set(String(b.id), b.Title);
  const itemsBy = groupItems(items);

  /* 면담(고객동향) / 전체 접촉 최근일 */
  const meetLast = new Map(), touchLast = new Map(), meetCnt = new Map();
  const wlMeta = { total: worklog.length, linked: 0, meet_total: 0, meet_linked: 0 };
  for (const r of worklog) {
    const bb = r[WL.buyer] ? byId.get(String(r[WL.buyer])) : null;
    const d = D_(r[WL.start]) || D_(r.Created);
    if (r[WL.category] === '고객동향') wlMeta.meet_total++;
    if (!bb || !d) continue;
    wlMeta.linked++;
    if (!touchLast.has(bb) || d > touchLast.get(bb)) touchLast.set(bb, d);
    if (r[WL.category] === '고객동향') {
      wlMeta.meet_linked++;
      meetCnt.set(bb, (meetCnt.get(bb) || 0) + 1);
      if (!meetLast.has(bb) || d > meetLast.get(bb)) meetLast.set(bb, d);
    }
  }

  /* 고객별 PO 묶기 (시험·철회 PO 제외) + PO별 납품 진행 */
  const byBB = new Map();
  const sch = new Map();
  for (const f of poRows) {
    if (excludeReason(f)) continue;
    const { bb } = parsePono((f.Title || '').trim());
    if (!bb) continue;
    if (!byBB.has(bb)) byBB.set(bb, []);
    byBB.get(bb).push(f);
    sch.set(f, poSchedule(f, itemsBy.get(String(f.id)) || [], asof));
  }

  const rows = [];
  for (const [bb, prs] of byBB) {
    const pods = prs.map(f => D_(f.field_4)).filter(Boolean).sort((a, b) => a - b);
    if (!pods.length) continue;
    const lastPo = pods[pods.length - 1];
    const pastDel = prs.map(f => sch.get(f).last_del).filter(Boolean).sort((a, b) => a - b);
    // 다음 납품 = 진행 중 PO의 납품예정 중 오늘 이후 가장 이른 날. 요청납기가 이미 지난 건은 따로 센다
    let nextDel = null, late = 0;
    for (const f of prs) {
      const s = sch.get(f), pod = D_(f.field_4);
      if (!s.open || !s.next || !pod || pod > asof) continue;
      if (s.next.d < asof) { late++; continue; }
      if (!nextDel || s.next.d < nextDel.d) nextDel = s.next;
    }

    /* 발주 간격 — 고객마다 다르다 (최근 2년) */
    const recent = pods.filter(d => (asof - d) / DAY <= 730);
    const gaps = [];
    for (let i = 0; i + 1 < recent.length; i++) gaps.push((recent[i + 1] - recent[i]) / DAY);
    const avg = gaps.length ? gaps.reduce((a, b) => a + b, 0) / gaps.length : null;
    let sd = null;
    if (gaps.length > 1) {
      const m = avg;
      sd = Math.sqrt(gaps.reduce((a, g) => a + (g - m) * (g - m), 0) / gaps.length);
    }
    const cv = (avg && sd != null && avg > 0) ? sd / avg : null;
    let conf;
    if (gaps.length >= 6 && cv != null && cv <= 0.6) conf = '높음';
    else if (gaps.length >= 3 && cv != null && cv <= 1.0) conf = '보통';
    else if (gaps.length) conf = '낮음';
    else conf = '표본부족';

    const expNext = avg ? new Date(lastPo.getTime() + Math.round(avg) * DAY) : null;
    const overdue = (expNext && expNext < asof) ? Math.round((asof - expNext) / DAY) : 0;
    const elapsed = Math.round((asof - lastPo) / DAY);
    const ratio = avg ? +(elapsed / avg).toFixed(2) : null;

    const salesBy = {};                           // 발주연도별 매출 (품목 매출 합)
    for (const f of prs) {
      const d = D_(f.field_4);
      if (d) salesBy[d.getUTCFullYear()] = (salesBy[d.getUTCFullYear()] || 0) + sch.get(f).sales;
    }
    const b = bmap.get(bb) || {};
    const target = Number(b[F.target] || 0);
    const s26 = salesBy[asof.getUTCFullYear()] || 0;
    const ml = meetLast.get(bb), tl = touchLast.get(bb);

    rows.push({
      bb, name: b[F.name] || bb,
      deal: b[F.deal] || '미지정', industry: b[F.industry] || '미분류', status: b[F.deal] || null,
      po_elapsed: elapsed, last_po: ymd(lastPo),
      del_elapsed: pastDel.length ? Math.round((asof - pastDel[pastDel.length - 1]) / DAY) : null,
      next_del: nextDel ? ymd(nextDel.d) : null,
      next_del_src: nextDel ? nextDel.src : null,
      next_del_in: nextDel ? Math.round((nextDel.d - asof) / DAY) : null,
      late_del: late,
      avg_gap: avg ? Math.round(avg) : null,
      gap_sd: sd != null ? Math.round(sd) : null,
      confidence: conf, gap_n: gaps.length, ratio,
      exp_next_po: expNext ? ymd(expNext) : null,
      overdue,
      meet_elapsed: ml ? Math.round((asof - ml) / DAY) : null,
      meet_last: ml ? ymd(ml) : null,
      meet_count: meetCnt.get(bb) || 0,
      touch_elapsed: tl ? Math.round((asof - tl) / DAY) : null,
      touch_last: tl ? ymd(tl) : null,
      s2025: salesBy[asof.getUTCFullYear() - 1] || 0,
      s2026: s26,
      target,
      progress: target ? s26 / target : null,
      po_count_2026: pods.filter(d => d.getUTCFullYear() === asof.getUTCFullYear()).length,
    });
  }
  rows.sort((a, b) => (b.target - a.target) || (b.s2026 - a.s2026));
  const active = rows.filter(r => r.target > 0);

  /* 진행 중 PO (발주 완료 ~ 납품 전) — 부분 선적은 남은 품목만 */
  const inflight = [];
  for (const [f, s] of sch) {
    const pod = D_(f.field_4);
    if (!pod || pod > asof || !s.open) continue;
    const { bb } = parsePono((f.Title || '').trim());
    const b = bmap.get(bb) || {};
    inflight.push({
      po: f.Title, bb, name: b[F.name] || bb,
      deal: b[F.deal] || '미지정', industry: b[F.industry] || '미분류',
      po_date: ymd(pod), po_age: Math.round((asof - pod) / DAY),
      etd: s.etd ? ymd(s.etd) : null,
      delivery: s.next ? ymd(s.next.d) : null,
      del_src: s.next ? s.next.src : null,          // ship = 선적 일정 · req = 고객 요청납기
      days_to: s.next ? Math.round((s.next.d - asof) / DAY) : null,
      sales: s.sales_open,
      partial: s.partial,                           // 부분 선적 — 금액은 남은 품목분
      ff: null,
    });
  }
  inflight.sort((a, b) => (a.days_to == null) - (b.days_to == null) || (a.days_to - b.days_to));

  const uniq = k => [...new Set(active.map(r => r[k]))].sort();
  return {
    meta: {
      board: '영업 현황',
      axis: '발주일(PODate) 기준 · 경과일은 오늘 대비',
      as_of: ymd(asof),
      worklog: wlMeta,
      note: '평균발주주기는 고객별로 다름. 지연 = 최종발주 후 경과일이 그 고객의 평균주기를 넘은 일수.',
    },
    facets: { deal: uniq('deal'), industry: uniq('industry') },
    summary: {
      customers: active.length,
      overdue_count: active.filter(r => r.overdue > 0).length,
      upcoming_del_30d: active.filter(r => r.next_del_in != null && r.next_del_in >= 0 && r.next_del_in <= 30).length,
      no_po_90d: active.filter(r => r.po_elapsed > 90).length,
      no_meet: active.filter(r => r.meet_elapsed == null).length,
      inflight_po: inflight.length,
      inflight_sales: inflight.reduce((a, x) => a + x.sales, 0),
      inflight_customers: new Set(inflight.map(x => x.bb)).size,
      inflight_nodate: inflight.filter(x => x.days_to == null).length,
      inflight_req: inflight.filter(x => x.del_src === 'req').length,
      inflight_late: inflight.filter(x => x.days_to != null && x.days_to < 0).length,
    },
    customers: active,
    inflight,
  };
}


/* ── 화면 시작 ── */
function setStage(msg, sub) {
  const s = document.getElementById('stage');
  if (!s) return;
  s.querySelector('.stage-msg').textContent = msg;
  s.querySelector('.stage-sub').textContent = sub || '';
}
async function boot() {
  try {
    if (CFG.clientId.startsWith('CLIENT_ID')) {
      setStage('설정이 필요합니다', 'Entra 앱 등록의 클라이언트 ID가 비어 있습니다. build_live.py --client-id <ID> 로 다시 만드세요.');
      return;
    }
    setStage('로그인 확인 중…', '회사 계정으로 인증합니다');
    const r = await loadLive(m => setStage('데이터 불러오는 중…', m));
    if (!r) return;                        // 리디렉션 진행 중
    D = r;
    document.getElementById('stage').remove();
    document.getElementById('app').hidden = false;
    const w = document.getElementById('whoami');
    if (w) w.textContent = r._who || '';
    start();
  } catch (e) {
    setStage('불러오지 못했습니다', (e && e.message) || String(e));
    console.error(e);
  }
}

let PAY, OPS;
function start(){
PAY = D.pay; OPS = D.ops;


/* ── format ── */
const KRW=n=>'₩'+Math.round(n).toLocaleString('ko-KR');
const eok=(n,d=1)=>(n/1e8).toFixed(d)+'억';
const eokS=n=>{const v=n/1e8;return {v:v>=100?v.toFixed(0):v.toFixed(1),u:'억'};};
const pct=(x,d=1)=>x==null?'-':(x*100).toFixed(d)+'%';
const spct=(x,d=1)=>(x>=0?'+':'')+(x*100).toFixed(d)+'%';
const pp=(x,d=1)=>x==null?'-':((x>=0?'+':'')+(x*100).toFixed(d)+'pp');
const NS='http://www.w3.org/2000/svg';
const el=(t,a={},k=[])=>{const e=document.createElementNS(NS,t);for(const q in a)e.setAttribute(q,a[q]);
  (Array.isArray(k)?k:[k]).forEach(c=>c&&e.appendChild(typeof c==='string'?document.createTextNode(c):c));return e;};
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shortName=s=>String(s||'').replace(/\((주|유)\)/g,'').replace(/주식회사/g,'').trim();

/* ── tooltip ── */
const tipEl=document.getElementById('tip');
function showTip(h,x,y){tipEl.innerHTML=h;tipEl.style.opacity=1;const r=tipEl.getBoundingClientRect();
  let px=x+14,py=y+14; if(px+r.width>innerWidth-8)px=x-r.width-14; if(py+r.height>innerHeight-8)py=y-r.height-14;
  tipEl.style.left=px+'px';tipEl.style.top=py+'px';}
const hideTip=()=>tipEl.style.opacity=0;
function bindTip(n,h){n.classList.add('hoverable');
  n.addEventListener('pointerenter',e=>showTip(h,e.clientX,e.clientY));
  n.addEventListener('pointermove',e=>showTip(h,e.clientX,e.clientY));
  n.addEventListener('pointerleave',hideTip);}
const tt=(t,rows)=>`<div class="tt-t">${esc(t)}</div>`+rows.map(r=>`<div class="tt-r"><span class="k">${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join('');

function ticks(max,n=4){if(max<=0)return[0,1];const raw=max/n,mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const nm=raw/mag,st=(nm>=5?5:nm>=2?2:nm>=1?1:.5)*mag;const o=[];for(let v=0;v<=max+st*.5;v+=st)o.push(v);return o;}

/* ── chart: grouped columns ── */
function gcols(mount,{labels,series,fmtY,fmtTip,rotate}){
  const W=620,H=250,mL=46,mR=10,mT=14,mB=rotate?52:36,iw=W-mL-mR,ih=H-mT-mB;
  const max=Math.max(...series.flatMap(s=>s.values),0),tk=ticks(max),tmax=tk[tk.length-1]||1;
  const svg=el('svg',{class:'cs',viewBox:`0 0 ${W} ${H}`,role:'img'});
  tk.forEach(t=>{const y=mT+ih-(t/tmax)*ih;
    svg.appendChild(el('line',{x1:mL,x2:W-mR,y1:y,y2:y,stroke:cv('--grid'),'stroke-width':1}));
    svg.appendChild(el('text',{x:mL-7,y:y+3.5,'text-anchor':'end',class:'ax'},fmtY(t)));});
  const n=labels.length,gw=iw/n,ns=series.length,bw=Math.max(3,Math.min(18,(gw-6)/ns));
  labels.forEach((lab,i)=>{const gx=mL+i*gw+gw/2;
    series.forEach((s,j)=>{const v=s.values[i]||0,bh=(v/tmax)*ih;
      const x=gx-(ns*bw+2*(ns-1))/2+j*(bw+2),y=mT+ih-bh;
      const r=el('rect',{x,y,width:bw,height:Math.max(bh,.5),rx:2.5,fill:s.color});
      bindTip(r,tt(lab,series.map(ss=>[ss.name,fmtTip(ss.values[i]||0)])));svg.appendChild(r);});
    if(rotate) svg.appendChild(el('text',{x:gx,y:H-mB+14,class:'glab','text-anchor':'end',transform:`rotate(-45 ${gx} ${H-mB+14})`},lab));
    else svg.appendChild(el('text',{x:gx,y:H-mB+14,'text-anchor':'middle',class:'glab'},lab));});
  mount.appendChild(svg);
}

/* ── chart: horizontal bullet (value vs target) ── */
function bullets(mount,{rows,maxOverride}){
  const rh=26,gap=7,mT=4,mL=112,mR=56,W=660,H=mT+rows.length*(rh+gap);
  const max=maxOverride||Math.max(...rows.map(r=>Math.max(r.value,r.target||0)),1),iw=W-mL-mR;
  const svg=el('svg',{class:'cs',viewBox:`0 0 ${W} ${H}`,role:'img'});
  rows.forEach((r,i)=>{const y=mT+i*(rh+gap);
    svg.appendChild(el('rect',{x:mL,y:y+rh/2-5,width:iw,height:10,rx:5,fill:cv('--track')}));
    const bw=(r.value/max)*iw;
    const col=r.progress!=null&&r.progress>=0.5?cv('--s1'):(r.progress!=null&&r.progress<0.3?cv('--s2'):cv('--s1'));
    const bar=el('rect',{x:mL,y:y+rh/2-5,width:Math.max(bw,1),height:10,rx:5,fill:col});
    bindTip(bar,tt(r.name,[['실적',KRW(r.value)],['목표',r.target?KRW(r.target):'-'],['달성율',pct(r.progress)]]));
    svg.appendChild(bar);
    if(r.target){const tx=mL+(r.target/max)*iw;
      svg.appendChild(el('line',{x1:tx,x2:tx,y1:y+rh/2-9,y2:y+rh/2+9,stroke:cv('--ink'),'stroke-width':2}));}
    svg.appendChild(el('text',{x:mL-9,y:y+rh/2+4,'text-anchor':'end',class:'glab',fill:cv('--ink')},shortName(r.name)));
    svg.appendChild(el('text',{x:W-mR+8,y:y+rh/2+4,class:'dlab',
      fill:r.progress>=0.5?cv('--good-ink'):cv('--secondary')},pct(r.progress,0)));});
  mount.appendChild(svg);
  const lg=document.createElement('div');lg.className='legend';
  lg.innerHTML=`<span><i style="background:var(--s1)"></i>실적</span><span><i style="width:2px;height:13px;border-radius:1px;background:var(--ink)"></i>연간 목표</span><span style="color:var(--muted)">우측 = 달성율</span>`;
  mount.appendChild(lg);
}

/* ── chart: lollipop (elapsed days) ── */
function lollipop(mount,{rows,fmtV,threshold,thLabel,hotBelow}){
  // hotBelow: 값이 작을수록 급함(D-day). 음수(기한 경과)는 0 위치에 붙여 그린다
  const rh=24,gap=6,mT=16,mL=112,mR=52,W=660,H=mT+rows.length*(rh+gap);
  const max=Math.max(...rows.map(r=>r.value),threshold||0,1),iw=W-mL-mR;
  const svg=el('svg',{class:'cs',viewBox:`0 0 ${W} ${H}`,role:'img'});
  if(threshold){const tx=mL+(threshold/max)*iw;
    svg.appendChild(el('line',{x1:tx,x2:tx,y1:mT-8,y2:H-4,stroke:cv('--critical'),'stroke-width':1,'stroke-dasharray':'3 3','stroke-opacity':.6}));
    svg.appendChild(el('text',{x:tx+4,y:mT-10,class:'glab',fill:cv('--bad-ink'),'font-size':10},thLabel||''));}
  rows.forEach((r,i)=>{const y=mT+i*(rh+gap)+rh/2,x=mL+(Math.max(r.value,0)/max)*iw;
    const hot=threshold&&(hotBelow?r.value<=threshold:r.value>threshold);
    svg.appendChild(el('line',{x1:mL,x2:x,y1:y,y2:y,stroke:hot?cv('--critical'):cv('--s1'),'stroke-width':2,'stroke-opacity':hot?.5:.32}));
    const dot=el('circle',{cx:x,cy:y,r:5,fill:hot?cv('--critical'):cv('--s1'),stroke:cv('--card'),'stroke-width':2});
    bindTip(dot,tt(r.name,r.rows||[['값',fmtV(r.value)]]));svg.appendChild(dot);
    svg.appendChild(el('text',{x:mL-9,y:y+4,'text-anchor':'end',class:'glab',fill:cv('--ink')},shortName(r.name)));
    svg.appendChild(el('text',{x:W-mR+8,y:y+4,class:'dlab',fill:hot?cv('--bad-ink'):cv('--secondary')},fmtV(r.value)));});
  mount.appendChild(svg);
}

/* ── chart: goal bar (목표 대비 누적 진행) ── */
function goalBar(mount,{target,segments,gap,gapName}){
  const W=660,H=62,mT=8,bh=30;
  const scale=Math.max(target,segments.reduce((a,s)=>a+s.value,0));
  const svg=el('svg',{class:'cs',viewBox:`0 0 ${W} ${H}`,role:'img'});
  svg.appendChild(el('rect',{x:0,y:mT,width:W,height:bh,rx:5,fill:cv('--track')}));
  let x=0;
  segments.forEach((s,i)=>{const w=(s.value/scale)*W;
    const r=el('rect',{x:x+(i?1:0),y:mT,width:Math.max(w-(i?1:0),1),height:bh,fill:s.color,
      rx:i===0?5:2});
    bindTip(r,tt(s.name,[['금액',KRW(s.value)],['건수',s.count+'건'],['목표 대비',pct(s.value/target)]]));
    svg.appendChild(r);
    if(w>84) svg.appendChild(el('text',{x:x+11,y:mT+19,class:'dlab',fill:'#fff'},eok(s.value,1)));
    x+=w;});
  if(gap>0){const gw=(gap/scale)*W;
    const g=el('rect',{x:x+1,y:mT,width:Math.max(gw-1,1),height:bh,rx:5,fill:'none',
      stroke:cv('--critical'),'stroke-width':1.4,'stroke-dasharray':'4 3','stroke-opacity':.75});
    bindTip(g,tt(gapName,[['금액',KRW(gap)],['목표 대비',pct(gap/target)]]));
    svg.appendChild(g);
    if(gw>84) svg.appendChild(el('text',{x:x+11,y:mT+19,class:'dlab',fill:cv('--bad-ink')},eok(gap,1)));}
  // 목표선
  const tx=(target/scale)*W;
  svg.appendChild(el('line',{x1:tx,x2:tx,y1:mT-6,y2:mT+bh+6,stroke:cv('--ink'),'stroke-width':2}));
  svg.appendChild(el('text',{x:tx-5,y:mT-9,'text-anchor':'end',class:'dlab'},'목표 '+eok(target,0)));
  mount.appendChild(svg);
  const lg=document.createElement('div');lg.className='legend';
  lg.innerHTML=segments.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)} ${eok(s.value,1)} · ${s.count}건</span>`).join('')
    +(gap>0?`<span><i style="background:transparent;border:1.5px dashed var(--critical)"></i>${esc(gapName)} ${eok(gap,1)}</span>`:'');
  mount.appendChild(lg);
}

/* ── multi-select (전체 = 아무것도 선택 안 함) ── */
let msSeq=0;
function multiSelect(mount,{label,options,selected,onChange,allLabel}){
  const id='ms'+(++msSeq);
  const wrap=document.createElement('div');wrap.className='ms';
  wrap.innerHTML=`<button class="ms-btn" id="${id}" aria-expanded="false" aria-haspopup="true">
      <span class="k">${esc(label)}</span><span class="v"></span><span class="car"></span></button>
    <div class="ms-pop" hidden role="group" aria-labelledby="${id}">
      <div class="ms-tools"><button data-a="all">전체 선택</button><button data-a="none">전체 해제</button></div>
      ${options.map(o=>`<label><input type="checkbox" value="${esc(o.value)}" ${selected.has(o.value)?'checked':''}>
        <span class="nm">${esc(o.label)}</span>${o.sub?`<span class="sub">${esc(o.sub)}</span>`:''}</label>`).join('')}
    </div>`;
  mount.appendChild(wrap);
  const btn=wrap.querySelector('.ms-btn'),pop=wrap.querySelector('.ms-pop'),vEl=wrap.querySelector('.v');
  const sync=()=>{
    if(!selected.size||selected.size===options.length){
      vEl.textContent=allLabel||'전체';
      const c=wrap.querySelector('.cnt'); if(c)c.remove();
    }else{
      const names=options.filter(o=>selected.has(o.value)).map(o=>o.label);
      vEl.textContent=names.length<=2?names.join(', '):names[0]+' 외';
      if(!wrap.querySelector('.cnt')){const s=document.createElement('span');s.className='cnt';btn.insertBefore(s,btn.querySelector('.car'));}
      wrap.querySelector('.cnt').textContent=selected.size;
    }};
  sync();
  const close=()=>{pop.hidden=true;btn.setAttribute('aria-expanded','false');};
  btn.addEventListener('click',e=>{e.stopPropagation();
    document.querySelectorAll('.ms-pop').forEach(p=>{if(p!==pop){p.hidden=true;p.previousElementSibling.setAttribute('aria-expanded','false');}});
    pop.hidden=!pop.hidden;btn.setAttribute('aria-expanded',String(!pop.hidden));});
  pop.addEventListener('click',e=>e.stopPropagation());
  pop.addEventListener('change',e=>{
    if(e.target.type!=='checkbox')return;
    if(e.target.checked)selected.add(e.target.value); else selected.delete(e.target.value);
    sync();onChange(selected);});
  pop.querySelectorAll('.ms-tools button').forEach(b=>b.addEventListener('click',()=>{
    const all=b.dataset.a==='all';
    selected.clear(); if(all)options.forEach(o=>selected.add(o.value));
    pop.querySelectorAll('input').forEach(i=>i.checked=all);
    sync();onChange(selected);}));
  document.addEventListener('click',close);
  return wrap;
}

/* ── table builder ── */
function table(cols,rows,rowClass){
  return `<div class="tbl-wrap"><table class="dt"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr class="${rowClass&&rowClass(r)?'hot':''}">${r.cells.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* ── card with chart/table switch ── */
let cardSeq=0;
function vizCard(mount,{title,note,draw,tableHTML,defaultView}){
  const id='vz'+(++cardSeq);
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<div class="card-head"><div><h3>${title}</h3>${note?`<div class="note">${note}</div>`:''}</div>
    ${tableHTML?`<div class="vswitch" role="group" aria-label="보기 전환">
      <button data-v="chart" aria-pressed="${defaultView!=='table'}">그래프</button>
      <button data-v="table" aria-pressed="${defaultView==='table'}">표</button></div>`:''}</div>
    <div class="vbody" id="${id}"></div>`;
  mount.appendChild(card);
  const body=card.querySelector('#'+id);
  const render=v=>{body.innerHTML='';
    if(v==='table'&&tableHTML) body.innerHTML=tableHTML;
    else draw(body);};
  render(defaultView==='table'?'table':'chart');
  card.querySelectorAll('.vswitch button').forEach(b=>b.addEventListener('click',()=>{
    card.querySelectorAll('.vswitch button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    render(b.dataset.v);}));
  return card;
}

/* ════════ BOARD 1 · 입금 현황 ════════ */
const PAY_YEARS=[...new Set(PAY.cells.map(c=>c.ym.slice(0,4)))].sort();
const CUR_Y=PAY.meta.current_year;
const paySelYears=new Set([CUR_Y]);
const paySelCust=new Set();

function payAgg(cells){
  const a={sales:0,cost:0,cogs:0,csales:0,po:0,col_sales:0,col_cost:0,col_cogs:0,col_csales:0,col_po:0,
           ytd_sales:0,ytd_cost:0,ytd_cogs:0,ytd_csales:0,ytd_po:0};
  cells.forEach(c=>{for(const k in a)a[k]+=c[k]||0;});
  a.coverage=a.col_sales?a.col_csales/a.col_sales:0;
  // 영업이익 = 매출 − (매입 + 부대비 + 물류비) / 매출총이익 = 매출 − 매입(COGS만, Power BI 정의)
  a.margin=a.col_csales?(a.col_csales-a.col_cost)/a.col_csales:null;
  a.gmargin=a.col_csales?(a.col_csales-a.col_cogs)/a.col_csales:null;
  a.confirmed=a.col_csales-a.col_cost;
  a.est=a.margin!=null?a.col_sales*a.margin:0;
  a.gross=a.gmargin!=null?a.col_sales*a.gmargin:0;
  a.ytd_margin=a.ytd_csales?(a.ytd_csales-a.ytd_cost)/a.ytd_csales:null;
  a.ytd_est=a.ytd_margin!=null?a.ytd_sales*a.ytd_margin:0;
  return a;
}
const payCells=(years,custs)=>PAY.cells.filter(c=>
  (!years.size||years.has(c.ym.slice(0,4)))&&(!custs.size||custs.has(c.bb)));

/* 전년 대비: 연도 1개 선택 시. 당해연도는 '연중 같은 시점'끼리 비교 */
function payYoY(){
  if(paySelYears.size!==1)return null;
  const y=[...paySelYears][0],py=String(+y-1);
  if(!PAY_YEARS.includes(py))return null;
  const c=payAgg(payCells(new Set([y]),paySelCust)),p=payAgg(payCells(new Set([py]),paySelCust));
  const partial=(y===CUR_Y);
  const g=(a,k)=>partial
    ?(k==='sales'?a.ytd_sales:k==='est'?a.ytd_est:k==='margin'?a.ytd_margin:a.ytd_po)
    :(k==='sales'?a.col_sales:k==='est'?a.est:k==='margin'?a.margin:a.col_po);
  const rate=k=>{const cvv=g(c,k),pv=g(p,k);return pv?(cvv-pv)/pv:null;};
  return {label:partial?(py+'년 동기'):(py+'년'),partial,
    sales:rate('sales'),est:rate('est'),po:rate('po'),
    marginPP:(g(c,'margin')!=null&&g(p,'margin')!=null)?g(c,'margin')-g(p,'margin'):null};
}
const dHTML=(v,lab,isPP)=>{
  if(v==null)return '<div class="sub">비교 기준 없음</div>';
  const up=v>=0,cls=Math.abs(v)<1e-9?'flat':(up?'up':'down');
  return `<div class="delta ${cls}">${up?'▲':'▼'} ${isPP?pp(v):spct(v)}
    <span style="color:var(--muted);font-weight:500">vs ${esc(lab)}</span></div>`;
};

function renderPay(){

    '<span class="hint">Power BI 슬라이서 대응 — 복수 선택 가능, 아무것도 안 고르면 전체</span>');

  const A=payAgg(payCells(paySelYears,paySelCust)),Y=payYoY();
  A.sched_po=PAY.scheduled.filter(x=>(!paySelYears.size||paySelYears.has(x.ym.slice(0,4)))
    &&(!paySelCust.size||paySelCust.has(x.bb))).reduce((a,x)=>a+x.po,0);
  const scope=paySelYears.size?[...paySelYears].sort().join(', '):'전체 연도';
  const s=eokS(A.col_sales),e=eokS(A.est);
  document.getElementById('payKpi').innerHTML=`

const OPS_TEST={
  overdue:x=>x.overdue>0,
  quiet:x=>x.po_elapsed>90,
  soon:x=>x.next_del_in!=null&&x.next_del_in>=0&&x.next_del_in<=30,
  nomeet:x=>x.meet_elapsed==null,
  behind:x=>x.progress!=null&&x.progress<0.3,
};
const OPS_CONDS=[
  {value:'overdue',label:'발주 지연',sub:String(OPS.customers.filter(OPS_TEST.overdue).length)},
  {value:'quiet',label:'90일+ 무발주',sub:String(OPS.customers.filter(OPS_TEST.quiet).length)},
  {value:'soon',label:'30일내 납품예정',sub:String(OPS.customers.filter(OPS_TEST.soon).length)},
  {value:'nomeet',label:'면담 기록 없음',sub:String(OPS.customers.filter(OPS_TEST.nomeet).length)},
  {value:'behind',label:'목표 30% 미만',sub:String(OPS.customers.filter(OPS_TEST.behind).length)},
];
const opsConds=new Set(),opsCust=new Set(),opsDeal=new Set(),opsInd=new Set();

function opsRows(){
  let r=OPS.customers.slice();
  if(opsCust.size)r=r.filter(x=>opsCust.has(x.bb));
  if(opsDeal.size)r=r.filter(x=>opsDeal.has(x.deal));
  if(opsInd.size)r=r.filter(x=>opsInd.has(x.industry));
  if(opsConds.size)r=r.filter(x=>[...opsConds].some(k=>OPS_TEST[k](x)));
  return r;
}
const confPill=c=>`<span class="pill ${c==='높음'?'ok':c==='보통'?'warn':'mut'}">${esc(c)}</span>`;
const gapCell=r=>r.avg_gap?`${r.avg_gap}일 ${confPill(r.confidence)}`:'<span class="pill mut">표본부족</span>';
const meetCell=r=>r.meet_elapsed==null
  ?'<span class="pill mut">기록없음</span>'
  :`${r.meet_elapsed}일<span class="mutx"> · ${r.meet_last}</span>`;

/* 고객별 발주경과 vs 그 고객의 평균주기 + 면담경과 */
function opsBars(mount,{rows}){
  const rh=30,gap=9,mT=20,mL=118,mR=104,W=680,H=mT+rows.length*(rh+gap);
  const max=Math.max(...rows.flatMap(r=>[r.po_elapsed,r.meet_elapsed||0,r.avg_gap||0]),1);
  const iw=W-mL-mR;
  const svg=el('svg',{class:'cs',viewBox:`0 0 ${W} ${H}`,role:'img'});
  svg.appendChild(el('text',{x:mL,y:10,class:'glab','font-size':10},'막대=경과일 · │=그 고객의 평균 발주주기'));
  rows.forEach((r,i)=>{
    const y=mT+i*(rh+gap);
    const late=r.overdue>0;
    // 발주 경과
    const w1=(r.po_elapsed/max)*iw;
    const b1=el('rect',{x:mL,y,width:Math.max(w1,1),height:12,rx:3,fill:late?cv('--critical'):cv('--s1')});
    bindTip(b1,tt(r.name,[['최종 발주',r.last_po],['경과',r.po_elapsed+'일'],
      ['평균 발주주기',r.avg_gap?r.avg_gap+'일 ('+r.confidence+')':'표본부족'],
      ['지연',late?r.overdue+'일':'없음'],
      ['예상 다음 발주',r.exp_next_po||'-']]));
    svg.appendChild(b1);
    // 면담 경과
    if(r.meet_elapsed!=null){
      const w2=(r.meet_elapsed/max)*iw;
      const b2=el('rect',{x:mL,y:y+15,width:Math.max(w2,1),height:12,rx:3,fill:cv('--s4')});
      bindTip(b2,tt(r.name,[['최근 면담',r.meet_last],['경과',r.meet_elapsed+'일'],['면담 기록',r.meet_count+'건']]));
      svg.appendChild(b2);
    }else{
      svg.appendChild(el('text',{x:mL+3,y:y+25,class:'glab','font-size':10,fill:cv('--muted')},'면담 기록 없음'));
    }
    // 그 고객의 평균주기 표식
    if(r.avg_gap){const tx=mL+(r.avg_gap/max)*iw;
      svg.appendChild(el('line',{x1:tx,x2:tx,y1:y-3,y2:y+15,stroke:cv('--ink'),'stroke-width':2}));}
    svg.appendChild(el('text',{x:mL-9,y:y+16,'text-anchor':'end',class:'glab',fill:cv('--ink')},shortName(r.name)));
    svg.appendChild(el('text',{x:W-mR+8,y:y+11,class:'dlab',fill:late?cv('--bad-ink'):cv('--secondary')},
      r.po_elapsed+'일'+(late?' (지연 '+r.overdue+')':'')));
    if(r.meet_elapsed!=null)
      svg.appendChild(el('text',{x:W-mR+8,y:y+26,class:'dlab',fill:cv('--muted'),'font-size':10},'면담 '+r.meet_elapsed+'일'));
  });
  mount.appendChild(svg);
  const lg=document.createElement('div');lg.className='legend';
  lg.innerHTML=`<span><i style="background:var(--s1)"></i>발주 경과일</span>
    <span><i style="background:var(--critical)"></i>발주 지연(주기 초과)</span>
    <span><i style="background:var(--s4)"></i>면담 경과일</span>
    <span><i style="width:2px;height:13px;border-radius:1px;background:var(--ink)"></i>그 고객의 평균 발주주기</span>`;
  mount.appendChild(lg);
}

    <div class="filters" id="opsFilters"><span class="flab">필터</span></div>
    <div class="grid g4" id="opsKpi">
      <div class="card kpi"><div class="lab">관리 고객</div><div class="val num">${s.customers}<span class="u">개사</span></div><div class="sub">2026 목표 배정</div></div>
      <div class="card kpi"><div class="lab">발주 지연</div><div class="val num" style="color:var(--bad-ink)">${s.overdue_count}<span class="u">개사</span></div><div class="sub">자기 평균주기 초과</div></div>
      <div class="card kpi"><div class="lab">면담 기록 없음</div><div class="val num" style="color:var(--warn-ink)">${s.no_meet}<span class="u">개사</span></div><div class="sub">WORK LOG 고객동향 미기록</div></div>
      <div class="card kpi"><div class="lab">진행 중 PO</div><div class="val num">${s.inflight_po}<span class="u">건</span></div><div class="sub">${eok(s.inflight_sales,2)} · ${s.inflight_customers}개사 · 주문~납품 사이</div></div>
    </div>
    <section><div class="sec-head"><span class="eyebrow">우선순위</span><h2>연락 우선순위</h2><span class="rule"></span></div><div id="opsMain"></div></section>
    <section><div class="sec-head"><span class="eyebrow">일정</span><h2>진행 중 PO (주문 → 납품)</h2><span class="rule"></span>
      <span class="sub">발주 완료 · 납품 전 ${s.inflight_po}건 · ${eok(s.inflight_sales,2)}</span></div><div id="opsDel"></div></section>
    <section><div class="sec-head"><span class="eyebrow">전체</span><h2>고객 현황표</h2><span class="rule"></span></div><div id="opsAll"></div></section>
    <div class="note" style="margin-top:12px">면담 데이터 출처: KNC WORK LOG ${w.fetchedAt?('· 수집 '+w.fetchedAt.slice(0,10)):''} ·
      전체 ${w.total}건 중 고객 연결 ${w.linked}건, 그중 '고객동향' ${w.meet_linked}건.
      기록이 적어 <b>${s.no_meet}개사는 면담 이력이 비어 있습니다</b>.</div>`);

  const of=document.getElementById('opsFilters');
  multiSelect(of,{label:'조건',allLabel:'조건 없음 (전체)',options:OPS_CONDS,
    selected:opsConds,onChange:()=>drawOps()});
  multiSelect(of,{label:'거래상태',allLabel:'전체',
    options:OPS.facets.deal.map(v=>({value:v,label:v,
      sub:String(OPS.customers.filter(c=>c.deal===v).length)})),
    selected:opsDeal,onChange:()=>drawOps()});
  multiSelect(of,{label:'산업군',allLabel:'전체',
    options:OPS.facets.industry.map(v=>({value:v,label:v,
      sub:String(OPS.customers.filter(c=>c.industry===v).length)})),
    selected:opsInd,onChange:()=>drawOps()});
  multiSelect(of,{label:'고객',allLabel:'전체 고객',
    options:OPS.customers.map(c=>({value:c.bb,label:shortName(c.name),
      sub:c.overdue>0?('지연 '+c.overdue+'일'):''})),
    selected:opsCust,onChange:()=>drawOps()});
  const rst=document.createElement('button');rst.className='reset';rst.textContent='초기화';
  rst.addEventListener('click',()=>{opsConds.clear();opsCust.clear();opsDeal.clear();opsInd.clear();renderOps();});
  of.appendChild(rst);
  of.insertAdjacentHTML('beforeend',
    '<span class="hint">조건은 복수 선택 시 <b>하나라도 해당</b>(OR) · 나머지 필터는 교집합(AND)</span>');
  drawOps();
}

function drawOps(){
  const rows=opsRows();
  const main=document.getElementById('opsMain');main.innerHTML='';
  // 거래중인 고객 전체를 2026 매출 큰 순으로 (필터에서 거래상태를 직접 고르면 그 선택을 따름)
  const pr=(opsDeal.size?rows:rows.filter(c=>c.deal==='거래중인고객'))
    .slice().sort((a,b)=>b.s2026-a.s2026);
  vizCard(main,{title:'발주 경과 · 면담 경과 — 고객별 자기 주기 기준',
    note:`검은 세로선이 그 고객의 평균 발주주기입니다. 막대가 선을 넘으면 평소보다 늦은 것 · 매출 많은 순 ${pr.length}개사`,
    draw:m=>{if(!pr.length){m.innerHTML='<div class="note" style="padding:20px 0">해당 고객이 없습니다.</div>';return;}
      opsBars(m,{rows:pr});},
    tableHTML:table(['고객','2026 실적','최종 발주','발주경과','평균주기(신뢰도)','지연','면담경과'],
      pr.map(c=>({cells:[esc(shortName(c.name)),eok(c.s2026,2),c.last_po,c.po_elapsed+'일',gapCell(c),
        c.overdue?`<span class="pill bad">${c.overdue}일</span>`:'<span class="pill mut">-</span>',
        meetCell(c)],overdue:c.overdue})),
      r=>r.overdue>0)});

  /* 진행 중 PO 전체 (주문 완료 ~ 납품 전) */
  const del=document.getElementById('opsDel');del.innerHTML='';
  const fl=OPS.inflight.filter(x=>
    (!opsCust.size||opsCust.has(x.bb))&&
    (!opsDeal.size||opsDeal.has(x.deal))&&
    (!opsInd.size||opsInd.has(x.industry)));
  const dated=fl.filter(x=>x.days_to!=null),undated=fl.filter(x=>x.days_to==null);
  const late=fl.filter(x=>x.days_to!=null&&x.days_to<0),reqN=fl.filter(x=>x.del_src==='req').length;
  const sumS=fl.reduce((a,x)=>a+x.sales,0);
  const dday=v=>v<0?'D+'+(-v):'D-'+v;
  const reqPill=x=>x.del_src==='req'?' <span class="pill mut">요청</span>':'';
  vizCard(del,{title:`진행 중 PO ${fl.length}건 · ${eok(sumS,2)}`,
    note:`발주는 됐고 아직 납품 전인 PO 전체 (고객 ${new Set(fl.map(x=>x.bb)).size}개사) · 부분 선적은 남은 품목 금액만`
      +(reqN?` · 선적 일정이 없는 ${reqN}건은 <b>고객 요청납기</b>로 표시`:'')
      +(late.length?` · <b style="color:var(--bad-ink)">요청납기 경과 ${late.length}건</b>`:'')
      +(undated.length?` · 납품예정일 미정 ${undated.length}건`:''),
    draw:m=>{
      if(!fl.length){m.innerHTML='<div class="note" style="padding:20px 0">진행 중 PO가 없습니다.</div>';return;}
      const show=dated.slice(0,18);
      lollipop(m,{rows:show.map(x=>({name:x.po+' ('+shortName(x.name)+')',value:x.days_to,
        rows:[['고객',x.name],['발주일',x.po_date+' ('+x.po_age+'일 경과)'],['ETD',x.etd||'-'],
              ['납품예정',x.delivery+(x.del_src==='req'?' (고객 요청납기)':'')],
              ['금액',KRW(x.sales)+(x.partial?' (남은 품목)':'')],['공장',x.ff||'-']]})),
        fmtV:dday,threshold:7,thLabel:'7일 이내',hotBelow:true});
      if(dated.length>show.length||undated.length){
        const n=document.createElement('div');n.className='note';n.style.marginTop='8px';
        n.textContent=`그래프는 임박한 ${show.length}건만 표시 — 전체는 '표'로 전환해 확인하세요.`;
        m.appendChild(n);}},
    tableHTML:table(['PO','고객','발주일','발주경과','ETD','납품예정','D-day','금액','공장'],
      fl.map(x=>({cells:[esc(x.po),esc(shortName(x.name)),x.po_date,x.po_age+'일',x.etd||'-',
        x.delivery?x.delivery+reqPill(x):'<span class="pill warn">미정</span>',
        x.days_to==null?'-':(x.days_to<0?`<span class="pill bad">${dday(x.days_to)}</span>`:dday(x.days_to)),
        KRW(x.sales)+(x.partial?' <span class="pill mut">잔량</span>':''),esc(x.ff||'-')],
        soon:x.days_to!=null&&x.days_to<=7})),
      r=>r.soon)});

  const all=document.getElementById('opsAll');
  all.innerHTML=`<div class="card"><div class="card-head"><div><h3>고객 현황 전체</h3>
    <div class="note">Power BI '영업 현황' 표와 같은 열 구성 · 신뢰도는 평균주기의 신뢰도이므로 같은 칸에 표기</div></div></div>
    ${table(['고객','거래상태','산업군','발주경과','평균주기(신뢰도)','지연','면담경과','다음 납품','2026 실적','달성율'],
      rows.map(c=>({cells:[esc(shortName(c.name)),esc(c.deal),esc(c.industry),c.po_elapsed+'일',gapCell(c),
        c.overdue?`<span class="pill bad">${c.overdue}일</span>`:'-',
        meetCell(c),
        (c.next_del?c.next_del+(c.next_del_src==='req'?' <span class="pill mut">요청</span>':''):'-')
          +(c.late_del?` <span class="pill bad">요청납기 경과 ${c.late_del}</span>`:''),
        eok(c.s2026,2),
        `<span class="pill ${c.progress>=0.5?'ok':c.progress>=0.3?'warn':'bad'}">${pct(c.progress,0)}</span>`],
        overdue:c.overdue})),
      r=>r.overdue>0)}</div>`;
}

/* ── nav ── */
const BOARDS={pay:{el:'boardPay',render:renderPay},ops:{el:'boardOps',render:renderOps}};
let active='pay';
function show(b){
  active=b;
  document.querySelectorAll('#boardNav button').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.board===b)));
  Object.entries(BOARDS).forEach(([k,v])=>document.getElementById(v.el).classList.toggle('hidden',k!==b));
  BOARDS[b].render();
  window.scrollTo({top:0,behavior:'instant'});
}
document.querySelectorAll('#boardNav button').forEach(btn=>btn.addEventListener('click',()=>show(btn.dataset.board)));

document.getElementById('asOf').textContent='데이터 기준 '+PAY.meta.as_of;
document.getElementById('foot').innerHTML=`
  <div><b>보드별 축이 다릅니다</b> — 입금 현황: 입금일(품목 결제일) · 영업 현황: 발주일(PODate).
  같은 데이터라도 "언제로 계산하느냐"가 달라 금액이 다릅니다.</div>
  <div style="margin-top:8px"><b>집계 기준</b> — 매출·매입은 <b>품목(POItem)</b> 기준입니다: 매출 = 품목 매출, 매입 = 품목별 원가(COGS 기록) + 품목 물류·부대비, 입금월 = 품목 결제일, ETD = 품목 선적일.
  PO 기준은 PO 건수·상태 같은 PO별 통계에만 씁니다. 시험·재고이동 PO와 철회(Withdrawn) PO·품목은 뺍니다.
  진행 중 PO의 납품예정은 품목 선적 일정, 없으면 고객 요청납기입니다.</div>
  <div style="margin-top:8px"><b>예상 매출이익</b> = 매출 × (원가 등록분의 마진율). 원가 미등록 품목을 같은 마진으로 가정한 추정치이며, 확정 이익과 원가등록율을 함께 표기합니다.</div>
  <div style="margin-top:8px"><b>평균 발주주기</b>는 고객마다 다릅니다. 최근 2년 발주 간격의 평균이며, 표본 수와 편차로 신뢰도(높음/보통/낮음)를 판정합니다.</div>
  <div style="margin-top:8px">출처: KNC 분기영업 파이프라인 + KNC WORK LOG · 데이터 품질: 입금일 이상 ${PAY.meta.quality.payment_date_invalid}건 · 미입력 ${PAY.meta.quality.payment_date_missing}건 / 전체 ${PAY.meta.quality.total_po}건 ·
  기록 통계(분기 리포트 등)는 별도 파일로 관리합니다.</div>`;

const rf=document.getElementById('refreshBtn');
rf.addEventListener('click',()=>{ rf.disabled=true; rf.textContent='불러오는 중…'; location.reload(); });

const tb=document.getElementById('themeBtn');
tb.addEventListener('click',()=>{const c=document.documentElement.getAttribute('data-theme');
  const dark=c?c==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  BOARDS[active].render();});

show('pay');

}  /* end start() */
boot();
</script>
